<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Designer plugin window: initial size, smallest size, user-resizable -->
<meta name="disguise-plugin-window-size" content="420,260">
<meta name="disguise-plugin-window-min-size" content="220,150">
<meta name="disguise-plugin-window-resizable" content="true">
<title>Audio Meter</title>
<link rel="stylesheet" href="disguise-ui.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="d3-app d3-embedded">
<header>
  <span id="status" class="dot off" title="Connection to the agent"></span>
  <select id="deviceSelect" class="d3-field" title="Device"></select>
  <div class="buttons">
    <button id="toggleSpectrum" class="d3-button" title="Show/hide spectrum">FFT</button>
    <button id="resetPeaks" class="d3-button" title="Reset peaks, clip and LTC counters">Reset</button>
    <button id="toggleSettings" class="d3-button" title="Connection settings">⚙</button>
  </div>
</header>
<div id="settings" class="d3-row" hidden>
  <span class="d3-label">Agent</span>
  <input id="agent" class="d3-field" spellcheck="false">
  <button id="reconnect" class="d3-button">Connect</button>
</div>
<div id="errorBar" class="d3-banner" hidden></div>
<div id="ltcBar" hidden>
  <div id="ltcTc" class="d3-hero stale">--:--:--:--</div>
  <div id="ltcStatus" class="d3-status">—</div>
  <div id="ltcSection" class="d3-section">LTC statistics</div>
  <div class="d3-section-body">
    <div class="d3-grid">
      <div class="d3-row nw"><span class="d3-label">Frame rate</span><span class="d3-value" id="ltcRate">—</span></div>
      <div class="d3-row nw"><span class="d3-label">Channel</span><span class="d3-value" id="ltcCh">—</span></div>
      <div class="d3-row nw"><span class="d3-label">Level</span><span class="d3-value" id="ltcLevel">—</span></div>
      <div class="d3-row nw"><span class="d3-label">Lost</span><span class="d3-value" id="ltcLost">—</span></div>
      <div class="d3-row nw"><span class="d3-label">Last minute</span><span class="d3-value" id="ltcMinute">—</span></div>
      <div class="d3-row nw"><span class="d3-label">Jumps</span><span class="d3-value" id="ltcJumps">—</span></div>
      <div class="d3-row nw"><span class="d3-label">Dropouts</span><span class="d3-value" id="ltcDrops">—</span></div>
      <div class="d3-row nw"><span class="d3-label">Jitter</span><span class="d3-value" id="ltcJitter">—</span></div>
    </div>
    <div id="ltcEvent" class="d3-caption ltc-event"></div>
  </div>
</div>
<main>
  <section class="meters">
    <canvas id="meters"></canvas>
  </section>
  <section class="spectrum">
    <canvas id="spectrum"></canvas>
  </section>
</main>
<footer>
  <span id="format" class="d3-muted"></span>
  <span class="d3-muted nw" title="Stereo correlation">Corr.</span>
  <canvas id="corr" title="Stereo correlation: +1 mono, 0 wide stereo, &lt;0 out of phase"></canvas>
  <span id="corrValue">—</span>
</footer>
<script src="app.js"></script>
</body>
</html>
